[build-system]
requires = ["setuptools>=84.2.1,<85", "setuptools-scm[simple]>=10.3.4,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "leomoon-quickcrypt"
dynamic = ["version"]
description = "Encrypt files and generate strong passwords."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "LeoMoon Studios" }]
dependencies = [
    "PySide6>=6.12,<7",
    "darkdetect>=0.8,<0.9",
    "pyAesCrypt>=6.1.1,<7",
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.22.3,<7",
    "uv>=0.13.5,<1",
]
test = [
    "pip-audit>=2.10,<3",
    "pytest>=9.1.1,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.17.2,<1",
]

[project.gui-scripts]
leomoon-quickcrypt = "leomoon_quickcrypt.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["leomoon_quickcrypt*"]

[tool.setuptools.package-data]
leomoon_quickcrypt = ["assets/fonts/*.ttf", "assets/icons/*", "ui/*.qrc", "ui/*.ui"]

[tool.setuptools_scm]
version_file = "src/leomoon_quickcrypt/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/leomoon_quickcrypt/_generated"]

[tool.ruff.lint]
select = ["F"]
