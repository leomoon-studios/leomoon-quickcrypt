[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leomoon-quickcrypt"
version = "1.0.0"
description = "Encrypt files and generate strong passwords."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "LeoMoon Studios" }]
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
leomoon-quickcrypt = "leomoon_quickcrypt.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["leomoon_quickcrypt*"]

[tool.setuptools.package-data]
leomoon_quickcrypt = ["assets/fonts/*.ttf", "assets/icons/*", "ui/*.qrc", "ui/*.ui"]
